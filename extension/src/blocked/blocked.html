<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Site blocked · Forge Focus</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="accents.css" />
    <link rel="stylesheet" href="ext.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="14" fill="var(--logo-ring)" />
          <rect x="3.2" y="3.2" width="57.6" height="57.6" rx="10.8" fill="var(--logo-tile)" />
          <path fill="var(--logo-mark)" d="M32 10 50 28 44 34 32 22 20 34 14 28Z" />
          <path fill="var(--logo-mark)" d="M12 42h16l-4 8H12zM36 42h16v8H40z" />
        </svg>
        <span>Forge</span>
      </header>

      <main class="stage" id="main" aria-busy="true">
        <section class="view" id="view-blocked" aria-labelledby="site-title">
          <h1 id="site-title" tabindex="-1">This site is blocked</h1>

          <div class="session" id="session" hidden>
            <p class="clock tabular" id="clock" role="timer" aria-labelledby="clock-label">--:--</p>
            <p class="session-note" id="clock-label">Time left in this focus session</p>
          </div>
          <p class="task" id="task" hidden>Working on <span class="task-title" id="task-title"></span></p>

          <p class="motivation" id="motivation" hidden></p>

          <div class="actions">
            <button class="btn btn-primary" id="btn-back" type="button">Back to work</button>
            <button class="btn btn-quiet" id="btn-access" type="button">I need access</button>
          </div>
          <p class="notice" id="notice" role="status" hidden></p>
        </section>

        <section class="view" id="view-wait" aria-labelledby="wait-title" hidden>
          <h2 id="wait-title" tabindex="-1">Take a breath</h2>
          <p class="lede">Pause and ask whether this matches what you set out to do. You can continue in:</p>
          <p class="count tabular" id="wait-count" aria-hidden="true">60</p>
          <p class="sr-only" id="wait-live" aria-live="polite"></p>
          <div class="actions">
            <button class="btn btn-primary" id="btn-wait-cancel" type="button">Back to work</button>
          </div>
        </section>

        <section class="view" id="view-phrase" aria-labelledby="phrase-title" hidden>
          <h2 id="phrase-title" tabindex="-1">Emergency access</h2>
          <p class="lede">Type this phrase to unlock <span id="phrase-site">this site</span> for 5 minutes. Every unlock is logged.</p>
          <p class="phrase" id="phrase-text"></p>
          <form class="phrase-form" id="phrase-form" autocomplete="off">
            <label class="field-label" for="phrase-input">Type the phrase exactly</label>
            <input class="field" id="phrase-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="phrase-error" />
            <p class="notice" id="phrase-error" role="alert" data-tone="error" hidden></p>
          </form>
          <div class="actions">
            <button class="btn btn-primary" id="btn-phrase-cancel" type="button">Back to work</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="js/blocked/blocked.js"></script>
  </body>
</html>
