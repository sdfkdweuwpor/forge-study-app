[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers (CSP etc.) come from dist/_headers, generated from security-headers.mjs.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# A hashed file that no longer exists (an open tab from before a deploy asks for an old chunk) must
# be a real 404, not the SPA shell: index.html served as JavaScript fails with a confusing MIME error.
# Redirects are matched top to bottom and, without force = true, only when no file exists at the path,
# so files that do exist in /assets/ are still served normally. This rule must stay above the SPA one.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
